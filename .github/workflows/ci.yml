name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Messenger ${{ matrix.messenger }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            messenger: '6.4.*'
          - php: '8.2'
            messenger: '7.0.*'
          - php: '8.2'
            messenger: '7.4.*'
          - php: '8.4'
            messenger: '8.0.*'
          - php: '8.4'
            messenger: '8.1.*'
          - php: '8.5'
            messenger: '^8.0'
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, xml, xmlwriter
          coverage: ${{ matrix.php == '8.5' && 'xdebug' || 'none' }}
          tools: composer:v2
      -
        name: Validate package manifest
        run: composer validate --strict
      -
        name: Resolve and install stable dependencies
        run: composer update --with 'symfony/messenger:${{ matrix.messenger }}' --prefer-dist --no-interaction --no-progress
      -
        name: Check platform requirements
        run: composer check-platform-reqs
      -
        name: Check Code Quality via PHP_CodeSniffer
        if: matrix.php == '8.5'
        run: bin/php_codesniffer
      -
        name: Check Code Quality via PHP-CS-Fixer
        if: matrix.php == '8.5'
        run: bin/php-cs-fixer
      -
        name: Execute tests via PHPUnit
        if: matrix.php != '8.5'
        run: composer test
      -
        name: Execute tests with coverage
        if: matrix.php == '8.5'
        run: vendor/bin/phpunit --coverage-clover var/log/coverage-clover.xml
      -
        name: Upload coverage reports to Codecov
        if: matrix.php == '8.5'
        uses: codecov/codecov-action@v4.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  docker:
    name: Docker development environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker compose build --pull
      - name: Check package in Docker
        run: |
          docker compose run --rm -T php composer install --prefer-dist --no-interaction --no-progress
          docker compose run --rm -T php composer check
  lint:
    name: Docker Lint
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
